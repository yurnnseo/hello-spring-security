<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 권한 없음 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .error-card { max-width: 640px; margin: 80px auto; }
        .error-code { font-size: 4rem; font-weight: 800; color: #e94560; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
    </div>
</nav>

<div class="container">
    <div class="card border-0 shadow-sm error-card">
        <div class="card-body text-center p-5">
            <div class="error-code">403</div>
            <h4 class="fw-bold mb-3">접근 권한이 없습니다.</h4>
            <p class="text-muted mb-4">
                이 페이지는 관리자만 접근할 수 있습니다.
            </p>
            <a th:href="@{/products}" class="btn btn-danger px-4">상품 목록으로 이동</a>
            <a th:href="@{/home}" class="btn btn-outline-secondary px-4">홈으로 이동</a>
        </div>
    </div>
</div>

<footer style="margin-top: 30px; padding-top: 14px; text-align: center; color: #666; font-size: 14px;">
    <p th:text="${'실습 수행 일시 : ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 (EEE) a hh:mm:ss') + '  |  학번: 2371225  |  성명: 신영서'}"></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
