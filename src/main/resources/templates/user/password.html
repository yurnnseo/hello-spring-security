<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .page-header { border-left: 4px solid #e94560; padding-left: 1rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
    </div>
</nav>

<div class="container">
    <div class="page-header mb-4">
        <h4 class="fw-bold mb-0">비밀번호 변경</h4>
        <small class="text-muted">현재 비밀번호 확인 후 새 비밀번호로 변경합니다.</small>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form th:action="@{/user/password}" th:object="${passwordChangeDto}" method="post">

                <div class="mb-3">
                    <label class="form-label">현재 비밀번호</label>
                    <input type="password" th:field="*{currentPassword}" class="form-control">
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('currentPassword')}"
                         th:errors="*{currentPassword}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">새 비밀번호</label>
                    <input type="password" th:field="*{newPassword}" class="form-control">
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('newPassword')}"
                         th:errors="*{newPassword}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">새 비밀번호 확인</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control">
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/home}" class="btn btn-outline-secondary">취소</a>
                    <button type="submit" class="btn btn-danger">변경</button>
                </div>

            </form>
        </div>
    </div>
</div>

<footer style="margin-top: 30px; padding-top: 14px; text-align: center; color: #666; font-size: 14px;">
    <p th:text="${'실습 수행 일시 : ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 (EEE) a hh:mm:ss') + '  |  학번: 2371225  |  성명: 신영서'}"></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
